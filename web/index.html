<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="AiKey Web" />
    <meta
      name="description"
      content="AiKey Web is the local-first console for AI credential vault, routing, usage, and cost governance."
    />
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)" />
    <meta property="og:site_name" content="AiKey" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AiKey Web · AI Governance Workbench" />
    <meta
      property="og:description"
      content="Local-first console for AI credential vault, routing, usage, and cost governance."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AiKey Web · AI Governance Workbench" />
    <meta
      name="twitter:description"
      content="Local-first console for AI credential vault, routing, usage, and cost governance."
    />
    <title>AiKey Web · AI Governance Workbench</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Theme boot (2026-09-03) — runs BEFORE first paint so a light-mode machine
      never sees a flash of dark.

      🔴 DARK IS THE ABSENT STATE. This only ever ADDS data-theme="light"; the
      dark palette is what src/index.css declares on bare :root. So if this
      script is skipped, blocked by CSP, or throws, the console renders exactly
      what it renders today. That is the whole safety argument for adding a
      second theme without touching the first.

      Storage can THROW (Safari private mode, some embedded webviews), not just
      return null — hence the guards. Any failure degrades to "no preference",
      which means follow the OS, which means dark unless the OS says light.

      Mirrors src/shared/utils/theme.ts, which owns this logic for the React
      side. The duplication is unavoidable: a fetched module cannot beat first
      paint. Keep the storage key and the attribute in sync between the two.
    -->
    <script>
      (function () {
        var KEY = 'aikey-theme';
        var el = document.documentElement;
        function stored() {
          try {
            var v = localStorage.getItem(KEY);
            return v === 'light' || v === 'dark' ? v : null;
          } catch (e) {
            return null;
          }
        }
        function apply(theme) {
          if (theme === 'light') el.setAttribute('data-theme', 'light');
          else el.removeAttribute('data-theme');
          var m = document.querySelector('meta[name="theme-color"]:not([media])');
          if (m) m.setAttribute('content', theme === 'light' ? '#f5f7fa' : '#18181b');
        }
        var mq = null;
        try {
          mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
        } catch (e) {
          mq = null;
        }
        apply(stored() || (mq && mq.matches ? 'light' : 'dark'));
        if (mq) {
          var onChange = function (e) {
            if (stored() === null) apply(e.matches ? 'light' : 'dark');
          };
          if (mq.addEventListener) mq.addEventListener('change', onChange);
          else if (mq.addListener) mq.addListener(onChange);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
