# CI gate — runs unit/in-process tests on every push and PR.
# Project rule: 持续交付 = CI/CD 失败即失败. A non-zero exit blocks the PR.
# The Go module lives under service/ (not repo root), so the job runs there.
# Scope: native `go test ./...` only (no docker/PG); heavier integration is
# left to nightly/opt-in so this gate needs nothing beyond a hosted runner.
#
# 2026-08-25 — BOTH jobs now check this repo out at `path: aikey-control`
# instead of at the workspace root, and clone their sibling repos beside it.
# Nothing here is self-contained: service/go.mod replaces four modules with
# `../../pkg/...` / `../../aikey-config-tool` / `../../aikey-data/baseline`,
# the codegen reads `../../aikey-cli/data/*.yaml`, and 22 of web's vitest
# fences compare this repo against `../../aikey-control-master/web` and
# `../../aikey-trial-server/web`. Checked out at the root, every one of those
# paths pointed ABOVE the workspace — so CI was red on every branch, develop
# included, for reasons that had nothing to do with the change under review.
# Do not remove the `path:` inputs; without them the relative paths break again.
# See workflow/CI/bugfix/2026-08-25-aikey-control-ci-has-no-sibling-checkout.md
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aikey-control/service
    steps:
      - uses: actions/checkout@v4
        with:
          path: aikey-control

      # Keep `repos` and `require` in step with the `replace` block in
      # service/go.mod — those directories ARE the build inputs. aikey-config-tool
      # is the only private one; it is why this job needs the secret at all.
      - name: Check out sibling modules (service/go.mod replace targets)
        uses: ./aikey-control/.github/actions/sibling-checkout
        with:
          repos: pkg aikey-data aikey-config-tool
          require: >-
            pkg/aikeycompat
            pkg/providerroutes
            aikey-config-tool/go.mod
            aikey-data/baseline
          token: ${{ secrets.AIKEY_CI_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: aikey-control/service/go.mod
          cache-dependency-path: aikey-control/service/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1

  # 2026-08-02 (provider-credential-cascade). This repo owns
  # web/scripts/generate-provider-registry.mjs — the build-time codegen that
  # turns aikey-cli/data/*.yaml into the module BOTH SPAs import for the
  # credential dialog's provider list, protocol catalogue and Base URLs.
  #
  # Until now that script had no CI at all: it only ran as a prebuild hook, so a
  # change to it was executed but never CHECKED. The dialog's hand-written
  # provider list had drifted nine entries from the routing table and offered a
  # protocol value the backend rejects — for months, under a fully green CI —
  # precisely because nothing compared the generated output to anything.
  codegen:
    name: Provider-registry codegen (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aikey-control/web
    steps:
      - uses: actions/checkout@v4
        with:
          path: aikey-control

      # aikey-cli carries the YAML source of truth. aikey-control-master and
      # aikey-trial-server are read by the cross-repo parity fences in `npm test`
      # — the dual-edit byte-equality checks, the i18n catalogue coverage, the
      # three-vite-config shared-dir parity. Without them 22 of the 88 vitest
      # files fail; several of those fences deliberately assert their own
      # subject exists ("the master catalog exists (fence is not vacuous)"), so
      # a missing sibling shows up as red rather than as a quiet pass — but it
      # shows up a hundred lines late, which is why `require` names them here.
      #
      # ⚠ 2026-08-25 correction: the previous version of this step refused to run
      # unless AIKEY_CI_TOKEN was set, calling aikey-cli "the private sibling".
      # aikey-cli is public. The secret IS still required by this job — but for
      # aikey-control-master and aikey-trial-server, which are private. The guard
      # now sits on the real precondition instead of on a proxy for it.
      - name: Check out siblings (yaml source of truth + parity-fence subjects)
        uses: ./aikey-control/.github/actions/sibling-checkout
        with:
          repos: aikey-cli aikey-control-master aikey-trial-server
          require: >-
            aikey-cli/data/provider_registry.yaml
            aikey-cli/data/provider_fingerprint.yaml
            aikey-control-master/web/src
            aikey-trial-server/web/src
          token: ${{ secrets.AIKEY_CI_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      # 2026-08-11: this repo's CI ran ONLY vitest for the web app — no tsc.
      # The local dev loop (make restart-personal) deliberately bundles with
      # build:user-nocheck for speed, and its comment said "type safety is
      # still enforceable via type-check in CI" — which was untrue here: the
      # master repo's CI had the step, this one never did. A type error could
      # ride green CI straight into a bundle. The dev loop now has its own
      # tsc pre-gate (workflow/CI/Makefile), and this step closes the CI half.
      - name: type-check
        run: npm run type-check

      # Drives the real script over fixture YAMLs, including the cases that must
      # make it EXIT NON-ZERO (a routed provider with no display identity) and
      # the four-stage default-endpoint decision.
      - name: test
        run: npm test

      # I-8: the generated module is checked into git, so it can go stale — and a
      # stale copy is invisible, because `tsc` and `vite build` both succeed
      # against it. Regenerating and diffing is the only thing that notices.
      - name: Generated registry must not be stale (I-8)
        run: |
          set -euo pipefail
          npm run gen:provider-registry
          if ! git diff --exit-code -- src/shared/generated/provider-registry.ts; then
            echo "::error::web/src/shared/generated/provider-registry.ts is stale." \
                 "Run 'npm run gen:provider-registry' and commit the result. The YAML is" \
                 "the source of truth; the checked-in TS is a build artifact that must match it."
            exit 1
          fi
